name: Build and security checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install checksum-verified secret scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-tools" security-reports
          cd "$RUNNER_TEMP/security-tools"
          filename="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$filename" --output "$filename"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          grep "  $filename\$" checksums.txt | sha256sum --check
          tar -xzf "$filename" gitleaks
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Scan all Git history and current files
        run: |
          gitleaks git --redact --no-banner --report-format json --report-path security-reports/secrets-history.json
          gitleaks dir --redact --no-banner --report-format json --report-path security-reports/secrets-current.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          python -m pip install semgrep==1.180.0
      - name: Audit runtime and build dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix functions --audit-level=high
      - name: Static security scan
        run: semgrep scan --config .semgrep.yml --config p/javascript --severity ERROR --error --strict --metrics off --disable-version-check --json-output security-reports/semgrep.json functions js scripts server.js src templates
      - name: Build and validate public bundle
        run: |
          npm run build:hosting
          node scripts/validate_templates.js
          node scripts/test_styles.js
          npm run test:inventory
          node scripts/test_quarterly_youtube_resolver.js
          node scripts/test_now_artic_caption.js
          npm run test:hosting
      - name: Preserve redacted security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/
          retention-days: 3
