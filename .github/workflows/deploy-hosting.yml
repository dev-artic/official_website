name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.FIREBASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build the checked revision
        run: |
          npm ci
          npm run build:hosting
          npm run test:hosting
      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.33.0
      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: artic-official-home
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy only static Hosting
        run: firebase deploy --only hosting --project artic-official-home --non-interactive
      - name: Verify deployed pages, headers and existing APIs
        run: npm run smoke:hosting
      - name: Verify the migrated production domain and www redirect
        if: vars.FIREBASE_CUSTOM_DOMAIN_ENABLED == 'true'
        run: npm run smoke:hosting -- https://artic.live
