name: Sync All YouTube Playlists

on:
  # 매일 KST 오후 6시 10분 (UTC 09:10)
  schedule:
    - cron: '10 9 * * *'

  # 수동 즉시 실행 (GitHub Actions → Run workflow)
  workflow_dispatch:
    inputs:
      force_update:
        description: '변경 없어도 강제 커밋'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-playlists:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.34.2

      - name: Sync all playlists
        id: sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.MJ_YOUTUBE_API_KEY }}
          # ── 각 프로젝트의 플레이리스트 ID ──────────────────────
          # playlist_config.py의 playlist_id_env와 이름이 일치해야 합니다.
          # Secret이 없으면 playlist_config.py의 기본값(hardcoded)을 사용합니다.
          THE_ROOT_PLAYLIST_ID:            ${{ secrets.THE_ROOT_PLAYLIST_ID }}
          TASTING_NOTE_PLAYLIST_ID:        ${{ secrets.TASTING_NOTE_PLAYLIST_ID }}
          NEUTRAL_INTERVIEW_PLAYLIST_ID:   ${{ secrets.NEUTRAL_INTERVIEW_PLAYLIST_ID }}
          # 향후 프로젝트 추가 시 아래에 줄 추가:
          # NEW_PROJECT_PLAYLIST_ID: ${{ secrets.NEW_PROJECT_PLAYLIST_ID }}
        run: python scripts/update_playlists.py

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Rebuild static HTML pages from templates
        run: node scripts/build_pages.js

      - name: Validate templates
        run: |
          node scripts/validate_templates.js
          node scripts/test_styles.js

      - name: Commit & push updated files
        if: steps.sync.outputs.changed == 'true' || github.event.inputs.force_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_DEPLOY_ENABLED: ${{ vars.FIREBASE_DEPLOY_ENABLED }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/site.css src/projects/ projects/the-root/index.html projects/tasting-note/index.html projects/neutral-interview/index.html
          git diff --cached --quiet || git commit -m "chore: auto-sync YouTube playlists and rebuild static pages"
          git push
          
          # Bot pushes require an explicit workflow dispatch. No retry to a different host.
          if [ "$FIREBASE_DEPLOY_ENABLED" = "true" ]; then
            echo "Deployment target: Firebase Hosting"
            gh workflow run deploy-hosting.yml --ref main
          else
            echo "Deployment target: GitHub Pages (domain migration pending)"
            gh workflow run deploy-pages.yml --ref main
          fi
