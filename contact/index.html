nel-action{font-family:var(--font-sans);letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;cursor:pointer;align-items:center;gap:6px;padding:4px 0;font-size:.6rem;font-weight:700;text-decoration:none;transition:color .3s;display:inline-flex}.channel-action:hover{color:var(--text-primary)}.contact-footer{padding:var(--space-lg) 0;border-top:1px solid var(--border-color);text-align:right;font-family:var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-top:auto;font-size:.55rem;transition:border-color .5s}@keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}</style>

  <script>

    function copyText(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        btnElement.innerText = 'COPIED!';
        setTimeout(() => {
          btnElement.innerText = 'COPY ADDRESS';
        }, 2000);
      });
    }
